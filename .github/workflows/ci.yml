name: Kyna CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: Build, install, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKYNA_BUILD_TESTS=ON -DKYNA_FETCH_DEPENDENCIES=OFF -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install extension runtime dependencies
        run: npm ci --omit=dev --ignore-scripts --prefix editors/vscode-kyna
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify the staged installation
        run: cmake --install build --config Release --prefix staged-install
      - name: Install ELF relocation tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Verify portable CLI and installers
        run: python3 build_tools/packaging/stage_delivery.py --build build --output portable-delivery
      - name: Test the npm installer package
        working-directory: tools/npm-installer
        run: npm test
