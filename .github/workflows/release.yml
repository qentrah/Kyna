name: Release Kyna

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x86_64, archive: tar }
          - { os: ubuntu-24.04-arm, target: linux-arm64, archive: tar }
          - { os: macos-15-intel, target: darwin-x86_64, archive: tar }
          - { os: macos-14, target: darwin-arm64, archive: tar }
          - { os: windows-latest, target: windows-x86_64, archive: zip }
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v4
        id: core-cache
        with:
          path: .vcpkg-binary-cache
          key: core-ports-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: native-ports-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKYNA_BUILD_TESTS=ON -DKYNA_FETCH_DEPENDENCIES=OFF -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: npm ci --omit=dev --ignore-scripts --prefix editors/vscode-kyna
      - name: Test compiler and tooling
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify Debug and sanitizer configurations
        if: matrix.target == 'linux-x86_64'
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          for configuration in Debug Sanitizers; do
            directory="build-${configuration,,}"
            sanitizer=OFF
            if [ "$configuration" = Sanitizers ]; then sanitizer=ON; fi
            cmake -S . -B "$directory" -DCMAKE_BUILD_TYPE=Debug -DKYNA_ENABLE_SANITIZERS="$sanitizer" -DKYNA_FETCH_DEPENDENCIES=OFF -DVCPKG_MANIFEST_INSTALL=OFF -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/vcpkg_installed" -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            cmake --build "$directory" --parallel 3
            ctest --test-dir "$directory" --output-on-failure
          done
      - name: Install ELF relocation tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Stage and verify portable installation
        run: python3 build_tools/packaging/stage_delivery.py --build build --output delivery
      - name: Select verified payload
        shell: bash
        run: mv delivery/cli package
      - name: Sign macOS executables
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        shell: bash
        run: python3 build_tools/packaging/sign_payload.py package
      - name: Sign Windows executables
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && runner.os == 'Windows'
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: python3 build_tools/packaging/sign_payload.py package
      - name: Refresh signed binary inventory
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json,pathlib,sys
          sys.path.insert(0, "build_tools/packaging")
          from portable_runtime import digest
          root=pathlib.Path('package');file=root/'runtime-inventory.json';inventory=json.loads(file.read_text())
          for binary in inventory['binaries']:
              binary['sha256']=digest(root/binary['path'])
          file.write_text(json.dumps(inventory,indent=2)+'\n')
          PYCODE
      - name: Create Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -czf "kyna-${{ matrix.target }}.tar.gz" -C package .
      - name: Create Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath "kyna-${{ matrix.target }}.zip"
      - name: Notarize macOS archive
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: python3 build_tools/packaging/notarize_payload.py package
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: kyna-${{ matrix.target }}.*
      - uses: actions/upload-artifact@v7
        with:
          name: kyna-${{ matrix.target }}
          path: kyna-${{ matrix.target }}.*
      - uses: actions/cache/save@v4
        if: always() && steps.core-cache.outputs.cache-hit != 'true'
        with:
          path: .vcpkg-binary-cache
          key: ${{ steps.core-cache.outputs.cache-primary-key }}

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Package and validate VSIX
        env:
          KYNA_RELEASE_REF: ${{ github.ref_name }}
          KYNA_VERIFY_REMOTE_IMAGES: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
        run: sh tools/package-vscode.sh
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: editors/vscode-kyna/kyna-language-support-*.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: kyna-vscode-extension
          path: editors/vscode-kyna/kyna-language-support-*.vsix

  native:
    name: Verify and package optional libraries
    uses: ./.github/workflows/native-packages.yml
    secrets: inherit

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [cli, extension, native]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the stable signing gate
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          SIGNED_RELEASE_ENABLED: ${{ vars.KYNA_SIGNED_RELEASE_ENABLED }}
        run: test "$SIGNED_RELEASE_ENABLED" = true
      - uses: actions/checkout@v7
      - name: Verify the release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version=$(sed -nE 's/^project\(kyna VERSION ([^ ]+) .*/\1/p' CMakeLists.txt)
          test -n "$project_version"
          test "${version%%-*}" = "$project_version"
      - uses: actions/download-artifact@v8
        with: { path: artifacts, merge-multiple: true }
      - name: Add installers and checksums
        run: |
          cp install.sh install.ps1 artifacts/
          (cd artifacts && sha256sum kyna-* install.sh install.ps1 > SHA256SUMS)
      - name: Create GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 build_tools/packaging/publish_release.py --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --assets artifacts

  npm:
    name: Prepare npm installer for owner publication
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set the package version
        working-directory: tools/npm-installer
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Test the package
        working-directory: tools/npm-installer
        run: npm test
      - name: Verify the matching GitHub build
        working-directory: tools/npm-installer
        run: |
          node scripts/install.js
          node bin/ky.js --version
      - name: Prepare the verified npm archive
        working-directory: tools/npm-installer
        run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-installer-for-owner-publication
          path: tools/npm-installer/*.tgz

  container:
    name: Publish container
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v6
        id: container-metadata
        with:
          images: ghcr.io/qentrah/kyna
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: KYNA_VERSION=${{ github.ref_name }}
          tags: ${{ steps.container-metadata.outputs.tags }}
          labels: ${{ steps.container-metadata.outputs.labels }}

  marketplace:
    name: Publish VS Code Marketplace extension
    if: startsWith(github.ref, 'refs/tags/')
    needs: [extension, release]
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/download-artifact@v8
        with: { name: kyna-vscode-extension, path: extension }
      - name: Publish extension
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath extension/*.vsix --pat "$VSCE_PAT"
